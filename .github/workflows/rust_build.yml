name: Rust Build and Release

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Main Binary (displayflow)
        run: cargo build --release

      - name: Fetch animation binary (fallback from ScreenAnimation)
        shell: pwsh
        run: |
          if (-not (Test-Path "screen_animation.exe")) {
            Write-Host "screen_animation.exe nicht im Repo - versuche Download aus ScreenAnimation-Release..."
            $rel = gh api repos/piot5/ScreenAnimation/releases/latest -q .tag_name 2>$null
            if ($rel) {
              gh release download -R piot5/ScreenAnimation --pattern "*.exe" -D . --clobber
            } else {
              Write-Host "Kein ScreenAnimation-Release vorhanden - animation binary wird uebersprungen."
            }
          }
          if (Test-Path "screen_animation.exe") { Write-Host "screen_animation.exe bereit." }

      - name: Bundle Suite
        shell: pwsh
        run: |
          
          New-Item -ItemType Directory -Force -Path ./publish
          
          
          Copy-Item "target/release/displayflow.exe" -Destination "./publish/"
          
          
          if (Test-Path "screen_animation.exe") { 
            Copy-Item "screen_animation.exe" -Destination "./publish/" 
          }
          if (Test-Path "DF.ico") { 
            Copy-Item "DF.ico" -Destination "./publish/" 
          }
          if (Test-Path "sounds") {
            Copy-Item -Path "sounds" -Destination "./publish/" -Recurse
          }
          
          
          Compress-Archive -Path ./publish/* -DestinationPath ./displayflow.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: displayflow.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}